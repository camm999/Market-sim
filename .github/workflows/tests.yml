name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      # whole repo, not just the engine: streamlit_app.py, main.py and benchmarks/
      # used to sit outside this and had type errors nothing was checking for.
      - name: Type check
        run: python -m mypy lob simulator metrics analysis tests benchmarks main.py streamlit_app.py --ignore-missing-imports --explicit-package-bases
